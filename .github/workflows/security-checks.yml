name: Security regression checks

on:
  pull_request:
  push:
    branches: [main]

# Validation only: no AWS credentials, OIDC token, plan, apply, or deployment.
permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Application regression tests
        run: node --test theme-a-web-three-tier/tests/*.test.mjs
      - name: Application syntax
        run: |
          node --check theme-a-web-three-tier/demo/app/server.mjs
          node --check theme-a-web-three-tier/demo/app/handler.mjs
      - name: Kubernetes static guardrails and shell syntax
        run: |
          python3 theme-b-microservices/scripts/check-static.py
          python3 theme-b-microservices/scripts/test-security.py
          bash -n theme-b-microservices/scripts/verify-local.sh
          bash -n theme-b-microservices/scripts/restart-db-workloads.sh

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - theme-a-web-three-tier
          - theme-b-microservices/01-infra
          - theme-b-microservices/02-platform
          - theme-b-microservices/03-apps
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - name: Terraform mock tests (no AWS calls)
        if: matrix.root == 'theme-a-web-three-tier'
        run: terraform test -no-color
